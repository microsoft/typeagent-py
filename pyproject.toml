[build-system]
requires = ["uv_build>=0.9.10,<0.13"]
build-backend = "uv_build"

[project]
name = "typeagent"
version = "0.5.0.dev"
description = "Incremental message indexing and querying pipelines using Structured RAG"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Guido van Rossum", email = "gvanrossum@microsoft.com" },
  { name = "Steven Lucco" },
  { name = "Umesh Madan" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = [
  "azure-identity>=1.25.3",
  "colorama>=0.4.6",
  # mcp 2.0 dropped mcp.server.fastmcp; src/typeagent/mcp/server.py needs
  # porting to the new MCPServer API before the cap can be lifted.
  "mcp[cli]>=1.29.0,<2",
  "numpy>=2.5.1",
  "openai>=2.53.0",
  # Only pydantic-core 2.48+ (pydantic 2.14) ships cp315 wheels.
  "pydantic>=2.14.0b1; python_version >= '3.15'",
  "pydantic>=2.13.4; python_version < '3.15'",
  "pydantic-ai-slim[openai]>=2.25.0",
  "pyreadline3>=3.5.6 ; sys_platform == 'win32'",
  "python-dotenv>=1.2.2",
  "stamina>=26.1.0",
  "tiktoken>=0.13.0",
  "typechat>=0.0.5",
  "webvtt-py>=0.5.1",
]

[project.optional-dependencies]
# Needed to enable --logfire flag to tools/query.py
logfire = [
  "logfire>=4.40.0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
]

[project.urls]
GitHub = "https://github.com/microsoft/typeagent-py"
Documentation = "https://github.com/microsoft/typeagent-py/tree/main/docs/README.md"

[tool.uv]
constraint-dependencies = [
    "python-multipart>=0.0.32",
]

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src", "tools"]
reportUnusedVariable = true
reportUnusedImport = true
reportDuplicateImport = true

[tool.isort]
profile = "black"
order_by_type = false
force_sort_within_sections = true

sections = ["FUTURE", "STDLIB", "THIRDPARTY", "AI", "FIRSTPARTY", "LOCALFOLDER"]
known_ai = ["mcp", "openai", "pydantic", "pydantic_ai", "tiktoken", "typechat"]
known_first_party = ["typeagent", "tests", "tools", "gmail", "demo"]
known_local_folder = ["conftest"]

[dependency-groups]
dev = [
  "azure-mgmt-authorization>=4.0.0",
  "azure-mgmt-keyvault>=14.0.1",
  "black>=26.5.1",
  "coverage[toml]>=7.15.4",
  "google-api-python-client>=2.198.0",
  "google-auth-httplib2>=0.4.1",
  "google-auth-oauthlib>=1.4.0",
  "isort>=8.0.1",
  "logfire>=4.40.0",  # So 'make check' passes
  "msgraph-sdk>=1.61.0",
  "opentelemetry-instrumentation-httpx>=0.65b0",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-mock>=3.15.1",
]
